<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Team Sheet"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Desert Springs Team Sheet</title>
<style>
/* Layout: one narrow column, three bottom tabs (Matches / Players / Backup). Match screen = team sheet slots on top, availability list below. */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --surface2:#E4EAE5; --ink:#16211C; --muted:#5A6860; --line:#D2DAD4;
  --accent:#0F5C4D; --accent-ink:#FFFFFF; --accent-soft:#D6E8E2;
  --yes:#18763F; --yes-bg:#DCF0E3; --maybe:#8F5A00; --maybe-bg:#FAEBC9; --no:#B3261E; --no-bg:#F8DAD6;
  --font-display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#17211C; --surface2:#1F2C26; --ink:#E6EEE9; --muted:#9AAAA1; --line:#2B3A33;
    --accent:#4FC3A1; --accent-ink:#05241B; --accent-soft:#16352D;
    --yes:#5ED38A; --yes-bg:#17372A; --maybe:#F0B84A; --maybe-bg:#3A2D10; --no:#FF8A80; --no-bg:#3D1B18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#17211C; --surface2:#1F2C26; --ink:#E6EEE9; --muted:#9AAAA1; --line:#2B3A33;
  --accent:#4FC3A1; --accent-ink:#05241B; --accent-soft:#16352D;
  --yes:#5ED38A; --yes-bg:#17372A; --maybe:#F0B84A; --maybe-bg:#3A2D10; --no:#FF8A80; --no-bg:#3D1B18;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 96px;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.1;font-weight:700}
h2{font-size:18px;font-weight:700}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;flex-direction:column;gap:4px;padding-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:8px}

.fx{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.fx.next{border-color:var(--accent);background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft)) , var(--surface);background-blend-mode:normal}
.fx-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}
.fx-opp{font-family:var(--font-display);font-weight:600;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.fx-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.pill.acc{background:var(--accent);color:var(--accent-ink)}
.pill.yes{background:var(--yes-bg);color:var(--yes)}
.pill.maybe{background:var(--maybe-bg);color:var(--maybe)}
.pill.no{background:var(--no-bg);color:var(--no)}

.back{align-self:flex-start;background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0;min-height:36px}
.slots{display:flex;flex-direction:column;gap:12px}
.grp{display:flex;flex-direction:column;gap:6px}
.grp-t{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slotrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;min-height:56px;padding:8px 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);min-width:0}
.slot.empty{background:transparent;border:1.5px dashed var(--line);color:var(--muted);justify-content:center}
.slot .nm{font-weight:600;overflow-wrap:anywhere}
.slot .tag{font-size:12px;font-weight:600}
.tag.no{color:var(--no)} .tag.maybe{color:var(--maybe)} .tag.none{color:var(--muted)} .tag.yes{color:var(--yes)}
.warn{background:var(--no-bg);color:var(--no);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600}
.btn{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--no);border-color:var(--no)}
.btn.danger.on{background:var(--no);color:#fff}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}

.av{display:flex;flex-direction:column}
.avr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.avr:first-child{border-top:0}
.avn{min-width:0}
.avn b{font-weight:600;display:block;overflow-wrap:anywhere}
.avn span{font-size:12px;color:var(--muted)}
.seg{display:flex;gap:4px}
.seg button{min-width:56px;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"].y{background:var(--yes-bg);color:var(--yes);border-color:var(--yes)}
.seg button[aria-pressed="true"].m{background:var(--maybe-bg);color:var(--maybe);border-color:var(--maybe)}
.seg button[aria-pressed="true"].n{background:var(--no-bg);color:var(--no);border-color:var(--no)}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],input[type=number],textarea{width:100%;min-height:44px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-width:0}
textarea{min-height:90px;resize:vertical;font-size:14px}
.score{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}

.pl{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;min-width:0}
.pl:first-child{border-top:0}
.pl .c{text-align:center;min-width:40px}
.pl .c b{display:block;font-variant-numeric:tabular-nums;font-family:var(--font-display);font-size:17px}
.pl .c span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 0 4px}
.cols span:nth-child(n+2){min-width:40px;text-align:center}

.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
.nav-in{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%;max-width:560px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:10px;min-height:52px;font-size:12px;font-weight:600;color:var(--muted)}
.nav button[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:86%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;z-index:31;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
.opt{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;width:100%;text-align:left;min-height:50px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-width:0}
.opt.dim{opacity:.7}
.opt b{font-weight:600;display:block;overflow-wrap:anywhere}
.opt span.s{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;max-width:90%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">

</head><body>
<div class="app" id="app"></div>
<nav class="nav" aria-label="Sections"><div class="nav-in" id="nav"></div></nav>
<div id="sheetHost"></div>
<div id="toastHost"></div>
<link rel="apple-touch-icon" href="icon.png">

<script>
(function(){
"use strict";
var KEY="desertSprings.teamApp.v1";
var SLOTS=["Singles 1","Singles 2","Pair 1 · A","Pair 1 · B","Pair 2 · A","Pair 2 · B"];

// ---- Seed: loaded from the captain's Excel sheet ----
function seed(){
  var P=[["Juan","Juan Francisco Flores Reyes",9.6,1],["Alejandro","Alejandro Fitzner Campagnoli",17],["Bijan","Bijan Majidi",14.5],
    ["Chris","Christopher Mear",5.3],["Damian","Damian Sheridan",17.3],["Dimitar","Dimitar Radev",10],
    ["Paco S.","Francisco Sanz Carmona",17.2],["Paco R.","Francisco Miguel Ramos Gonzalez",17.2],["Ian","Ian Donachy",10.1],
    ["Joaquin","Joaquin Álvarez de Toledo Larios",9.9],["John","John Hudson",9.9],["Jordi","Jordi Dalmau Canet",16.5],
    ["Jose","José Garcia Meca",13],["Stuart","Stuart Minton",6]];
  var players=P.map(function(p,i){return {id:"p"+(i+1),short:p[0],name:p[1],hcp:p[2],cap:!!p[3]}});
  function F(r,d,v,o,us,them){return {id:"f"+r,round:r,date:d,venue:v,opp:o,notes:"",us:us,them:them,av:{},team:[null,null,null,null,null,null]}}
  var fixtures=[
    F(1,"2026-10-04","La Envia Golf","Restaurante Valentin",0,8),
    F(2,"2026-10-18","Desert Springs","Cabo Golf",null,null),
    F(3,"2026-11-08","Desert Springs","Pandilla Estrella Galicia La Bellota",null,null),
    F(4,"2026-11-22","Club de Golf Almerimar","AG1976 Almerimar Golf",null,null),
    F(5,"2027-01-10","Club de Golf Playa Serena","Playa Serena Masculino",null,null),
    F(6,"2027-01-24","Desert Springs","Restaurante Valentin",null,null),
    F(7,"2027-02-14","Alboran Golf","Cabo Golf",null,null),
    F(8,"2027-03-07","Alboran Golf","Pandilla Estrella Galicia La Bellota",null,null),
    F(9,"2027-03-21","Desert Springs","AG1976 Almerimar Golf",null,null),
    F(10,"2027-04-04","Desert Springs","Playa Serena Masculino",null,null)];
  function yes(f,ids){ids.forEach(function(i){fixtures[f-1].av["p"+i]="y"})}
  yes(1,[4,14,1,2,5,3]); fixtures[0].team=["p4","p14","p1","p2","p5","p3"];
  yes(2,[10,14,1,13,5,8]); fixtures[1].team=["p10","p14","p1","p5","p13","p8"];
  return {v:1,players:players,fixtures:fixtures};
}

// ---- State ----
var memory=null, storageOK=true;
function load(){
  try{var raw=localStorage.getItem(KEY); if(raw){var d=JSON.parse(raw); if(d&&Array.isArray(d.players)&&Array.isArray(d.fixtures)) return d;}}catch(e){storageOK=false}
  return seed();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}
}
var S=load();
var ui={tab:"matches",fid:null,sheet:null,confirm:null};

// ---- Helpers ----
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fx(id){return S.fixtures.find(function(f){return f.id===id})}
function pl(id){return S.players.find(function(p){return p.id===id})}
function nm(id){var p=pl(id);return p?p.short:"?"}
function pd(s){if(!s)return null;var a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])}
function fmt(s,yr){var d=pd(s);if(!d)return "Date TBC";var o={weekday:"short",day:"numeric",month:"short"};if(yr)o.year="numeric";return d.toLocaleDateString("en-GB",o)}
function today0(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function daysTo(s){var d=pd(s);return d?Math.round((d-today0())/864e5):null}
function rel(s){var n=daysTo(s);if(n===null)return "";if(n===0)return "Today";if(n===1)return "Tomorrow";if(n===-1)return "Yesterday";if(n<0)return Math.abs(n)+" days ago";if(n<14)return "In "+n+" days";if(n<70)return "In "+Math.round(n/7)+" weeks";return "In "+Math.round(n/30)+" months"}
function result(f){if(f.us==null||f.them==null)return null;return {us:f.us,them:f.them,o:f.us>f.them?"W":f.us<f.them?"L":"D"}}
function isHome(f){return /desert springs/i.test(f.venue||"")}
function picked(pid,exclude){return S.fixtures.reduce(function(n,f){return n+((f.id!==exclude&&f.team.indexOf(pid)>-1)?1:0)},0)}
function played(pid){return S.fixtures.reduce(function(n,f){return n+((result(f)&&f.team.indexOf(pid)>-1)?1:0)},0)}
function nextFx(){
  var c=S.fixtures.filter(function(f){return !result(f)&&f.date&&daysTo(f.date)>=0}).sort(function(a,b){return a.date<b.date?-1:1});
  return c[0]||null;
}
function counts(f){
  var y=0,m=0,n=0;S.players.forEach(function(p){var a=f.av[p.id];if(a==="y")y++;else if(a==="m")m++;else if(a==="n")n++});
  return {y:y,m:m,n:n,w:S.players.length-y-m-n};
}
function teamCount(f){return f.team.filter(Boolean).length}
function status(f,pid){var a=f.av[pid];return a==="y"?"yes":a==="m"?"maybe":a==="n"?"no":"none"}
var STATUS_TXT={yes:"Available",maybe:"Maybe",no:"Said no",none:"No reply yet"};

function teamText(f){
  var t=f.team.map(function(id){return id?nm(id):"TBC"});
  var L=["ALPEMA-SEDESA-DESERT SPRINGS","Round "+f.round+" · "+fmt(f.date,true),(f.venue||"Venue TBC")+(isHome(f)?" (home)":" (away)")+" v "+(f.opp||"TBC"),"",
    "Singles",t[0],t[1],"","Pairs","1. "+t[2]+" & "+t[3],"2. "+t[4]+" & "+t[5]];
  if(f.notes&&f.notes.trim()){L.push("",f.notes.trim())}
  return L.join("\n");
}
function toast(msg){
  var h=document.getElementById("toastHost");h.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';
  clearTimeout(toast.t);toast.t=setTimeout(function(){h.innerHTML=""},2200);
}
function copyText(text,okMsg){
  function fallback(){ui.sheet={type:"text",title:"Copy this text",text:text};render();setTimeout(function(){var t=document.getElementById("copyBox");if(t){t.focus();t.select()}},50)}
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast(okMsg||"Copied")},fallback)}
    else fallback();
  }catch(e){fallback()}
}

// ---- Views ----
var IC={
  matches:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  players:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.2a3.2 3.2 0 0 1 0 6M18 14.3c1.8.8 3 2.6 3 4.7"/></svg>',
  more:'<svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M4 19h16"/></svg>'
};
function navView(){
  return [["matches","Matches"],["players","Players"],["more","Backup"]].map(function(t){
    return '<button data-act="tab" data-tab="'+t[0]+'"'+((ui.tab===t[0]&&!ui.fid)||(ui.fid&&t[0]==="matches")?' aria-current="true"':'')+'>'+IC[t[0]]+t[1]+'</button>';
  }).join("");
}
function matchesView(){
  var w=0,l=0,d=0,pf=0,pa=0;
  S.fixtures.forEach(function(f){var r=result(f);if(!r)return;pf+=r.us;pa+=r.them;if(r.o==="W")w++;else if(r.o==="L")l++;else d++});
  var nx=nextFx(), nxId=nx&&nx.id;
  var h='<div class="top"><div class="eyebrow">Alpema-Sedesa</div><h1>Desert Springs</h1></div>';
  h+='<div class="stats"><div class="stat"><b>'+w+'</b><span>Won</span></div><div class="stat"><b>'+d+'</b><span>Halved</span></div><div class="stat"><b>'+l+'</b><span>Lost</span></div><div class="stat"><b>'+pf+'–'+pa+'</b><span>Points</span></div></div>';
  S.fixtures.slice().sort(function(a,b){return a.round-b.round}).forEach(function(f){
    var r=result(f),c=counts(f),tc=teamCount(f),isNext=f.id===nxId;
    var right;
    if(r){right='<span class="pill '+(r.o==="W"?"yes":r.o==="L"?"no":"maybe")+'">'+r.o+' '+r.us+'–'+r.them+'</span>'}
    else if(f.date&&daysTo(f.date)<0){right='<span class="pill maybe">Result needed</span>'}
    else right='<span class="pill '+(tc===6?"yes":"")+'">'+tc+'/6 picked</span>';
    h+='<button class="fx'+(isNext?' next':'')+'" data-act="open" data-fid="'+f.id+'">'
      +'<div class="fx-row"><span class="eyebrow">Round '+f.round+' · '+esc(fmt(f.date))+'</span>'+(isNext?'<span class="pill acc">Next · '+esc(rel(f.date))+'</span>':'<span class="small muted">'+(r?'':esc(rel(f.date)))+'</span>')+'</div>'
      +'<div class="fx-opp">v '+esc(f.opp||"Opponent TBC")+'</div>'
      +'<div class="fx-row"><div class="fx-meta"><span class="small muted">'+esc(f.venue||"Venue TBC")+'</span><span class="pill">'+(isHome(f)?"Home":"Away")+'</span></div>'+right+'</div>'
      +(!r?'<div class="small muted">'+c.y+' yes · '+c.m+' maybe · '+c.n+' no · '+c.w+' awaiting</div>':'')
      +'</button>';
  });
  h+='<button class="btn block" data-act="addround">+ Add a round</button>';
  return h;
}
function slotBtn(f,i){
  var id=f.team[i];
  if(!id)return '<button class="slot empty" data-act="slot" data-idx="'+i+'" aria-label="Pick player for '+SLOTS[i]+'">+ Pick player</button>';
  var s=status(f,id);
  return '<button class="slot" data-act="slot" data-idx="'+i+'"><span class="nm">'+esc(nm(id))+'</span><span class="tag '+s+'">'+(s==="yes"?"✓ ":s==="no"?"✕ ":s==="maybe"?"? ":"")+STATUS_TXT[s]+'</span></button>';
}
function detailView(f){
  var r=result(f),c=counts(f),tc=teamCount(f);
  var bad=f.team.filter(function(id){return id&&status(f,id)==="no"}).length;
  var h='<button class="back" data-act="back">‹ All matches</button>';
  h+='<div class="top"><div class="eyebrow" id="hdrEye">Round '+f.round+' · '+esc(fmt(f.date,true))+'</div><h1 id="hdrTitle">v '+esc(f.opp||"Opponent TBC")+'</h1><div class="muted" id="hdrSub">'+esc(f.venue||"Venue TBC")+' · '+(isHome(f)?"Home":"Away")+'</div></div>';
  // Team sheet
  h+='<section class="card" aria-label="Team sheet"><div class="card-hd"><h2>Team sheet</h2><span class="pill '+(tc===6?"yes":"")+'">'+tc+' of 6 picked</span></div><div class="slots">'
    +'<div class="grp"><div class="grp-t">Singles</div><div class="slotrow">'+slotBtn(f,0)+slotBtn(f,1)+'</div></div>'
    +'<div class="grp"><div class="grp-t">Pair 1</div><div class="slotrow">'+slotBtn(f,2)+slotBtn(f,3)+'</div></div>'
    +'<div class="grp"><div class="grp-t">Pair 2</div><div class="slotrow">'+slotBtn(f,4)+slotBtn(f,5)+'</div></div></div>';
  if(bad)h+='<div class="warn" role="alert">'+bad+(bad===1?' selected player has':' selected players have')+' said no.</div>';
  h+='<button class="btn primary block" data-act="copyteam">Copy team for WhatsApp</button></section>';
  // Availability
  h+='<section class="card" aria-label="Availability"><div class="card-hd"><h2>Availability</h2></div>'
    +'<div class="small muted">'+c.y+' yes · '+c.m+' maybe · '+c.n+' no · '+c.w+' awaiting reply. Tap again to clear.</div><div class="av">';
  S.players.forEach(function(p){
    var a=f.av[p.id], inT=f.team.indexOf(p.id)>-1;
    h+='<div class="avr"><div class="avn"><b>'+esc(p.short)+(inT?' <span class="pill acc">In team</span>':'')+'</b><span class="num">HI '+esc(p.hcp==null?"–":p.hcp)+' · picked '+picked(p.id,null)+'×</span></div>'
      +'<div class="seg" role="group" aria-label="Availability for '+esc(p.short)+'">'
      +'<button class="y" data-act="av" data-pid="'+p.id+'" data-v="y" aria-pressed="'+(a==="y")+'">Yes</button>'
      +'<button class="m" data-act="av" data-pid="'+p.id+'" data-v="m" aria-pressed="'+(a==="m")+'">Maybe</button>'
      +'<button class="n" data-act="av" data-pid="'+p.id+'" data-v="n" aria-pressed="'+(a==="n")+'">No</button></div></div>';
  });
  h+='</div></section>';
  // Result
  h+='<section class="card" aria-label="Result"><div class="card-hd"><h2>Result</h2><span id="resBadge">'+resBadge(f)+'</span></div>'
    +'<div class="score"><div class="field"><label for="fxUs">Desert Springs</label><input id="fxUs" type="number" inputmode="numeric" min="0" step="0.5" data-fx="us" value="'+(f.us==null?"":f.us)+'"></div>'
    +'<div class="field"><label for="fxThem">Opponent</label><input id="fxThem" type="number" inputmode="numeric" min="0" step="0.5" data-fx="them" value="'+(f.them==null?"":f.them)+'"></div>'
    +'<button class="btn" data-act="clearresult">Clear</button></div></section>';
  // Details
  h+='<section class="card" aria-label="Match details"><h2>Match details</h2>'
    +'<div class="field"><label for="fxDate">Date</label><input id="fxDate" type="date" data-fx="date" value="'+esc(f.date)+'"></div>'
    +'<div class="field"><label for="fxVenue">Venue</label><input id="fxVenue" type="text" data-fx="venue" value="'+esc(f.venue)+'"></div>'
    +'<div class="field"><label for="fxOpp">Opponent</label><input id="fxOpp" type="text" data-fx="opp" value="'+esc(f.opp)+'"></div>'
    +'<div class="field"><label for="fxNotes">Notes for the team sheet (tee time, meeting point)</label><textarea id="fxNotes" data-fx="notes">'+esc(f.notes)+'</textarea></div>'
    +'<button class="btn danger block'+(ui.confirm==="delround"?" on":"")+'" data-act="delround">'+(ui.confirm==="delround"?"Tap again to delete this round":"Delete this round")+'</button></section>';
  return h;
}
function resBadge(f){var r=result(f);return r?'<span class="pill '+(r.o==="W"?"yes":r.o==="L"?"no":"maybe")+'">'+(r.o==="W"?"Won":r.o==="L"?"Lost":"Halved")+' '+r.us+'–'+r.them+'</span>':'<span class="pill">Not played</span>'}
function playersView(){
  var h='<div class="top"><div class="eyebrow">Squad</div><h1>Players</h1><div class="small muted">Played counts rounds with a result. Picked also includes upcoming rounds.</div></div>';
  h+='<section class="card"><div class="cols"><span>Player</span><span>HI</span><span>Played</span><span>Picked</span></div><div>';
  S.players.forEach(function(p){
    h+='<button class="pl" data-act="editplayer" data-pid="'+p.id+'"><span style="min-width:0"><b style="font-weight:600;overflow-wrap:anywhere">'+esc(p.short)+(p.cap?' <span class="pill acc">Captain</span>':'')+'</b><br><span class="small muted">'+esc(p.name)+'</span></span>'
      +'<span class="c"><b>'+esc(p.hcp==null?"–":p.hcp)+'</b></span><span class="c"><b>'+played(p.id)+'</b></span><span class="c"><b>'+picked(p.id,null)+'</b></span></button>';
  });
  h+='</div></section><button class="btn block" data-act="newplayer">+ Add a player</button>';
  return h;
}
function moreView(){
  var json=JSON.stringify(S);
  var h='<div class="top"><div class="eyebrow">Keep it safe</div><h1>Backup</h1></div>';
  if(!storageOK)h+='<div class="warn" role="alert">This browser is not saving data. Changes will be lost when you close the page.</div>';
  h+='<section class="card"><h2>Where your data lives</h2><p class="muted" style="margin:0">Everything is stored on this phone only. Add this page to your Home Screen first, then enter your data there, because the Home Screen app and Safari keep separate copies. Copy a backup now and then and keep it in Notes or WhatsApp.</p></section>';
  h+='<section class="card"><h2>Copy a backup</h2><button class="btn primary block" data-act="copybackup">Copy backup</button><textarea id="backupBox" readonly aria-label="Backup text">'+esc(json)+'</textarea></section>';
  h+='<section class="card"><h2>Restore a backup</h2><div class="field"><label for="restoreBox">Paste backup text</label><textarea id="restoreBox" placeholder="Paste here"></textarea></div>'
    +'<button class="btn block'+(ui.confirm==="restore"?" danger on":"")+'" data-act="restore">'+(ui.confirm==="restore"?"Tap again to replace all data":"Restore")+'</button></section>';
  h+='<section class="card"><h2>Start again</h2><p class="muted" style="margin:0">Puts back the names, dates and selections from the original Excel sheet.</p>'
    +'<button class="btn danger block'+(ui.confirm==="reset"?" on":"")+'" data-act="reset">'+(ui.confirm==="reset"?"Tap again to reset everything":"Reset to the Excel data")+'</button></section>';
  return h;
}
function sheetView(){
  var s=ui.sheet; if(!s)return "";
  var h='<div class="scrim" data-act="closesheet"></div><div class="sheet" role="dialog" aria-modal="true">';
  if(s.type==="pick"){
    var f=fx(ui.fid), cur=f.team[s.idx];
    h+='<div class="card-hd"><h2>'+SLOTS[s.idx]+'</h2><button class="btn" data-act="closesheet">Close</button></div><div class="small muted">Fewest picks first. Tap a name to select.</div>';
    [["yes","Available"],["maybe","Maybe"],["none","No reply yet"],["no","Said no"]].forEach(function(g){
      var list=S.players.filter(function(p){return status(f,p.id)===g[0]}).sort(function(a,b){return picked(a.id,f.id)-picked(b.id,f.id)||a.short.localeCompare(b.short)});
      if(!list.length)return;
      h+='<div class="grp"><div class="grp-t">'+g[1]+'</div>';
      list.forEach(function(p){
        var at=f.team.indexOf(p.id), note=at>-1?(at===s.idx?"Selected here":"Move from "+SLOTS[at]):"Picked "+picked(p.id,f.id)+"× in other rounds";
        h+='<button class="opt'+(g[0]==="no"?" dim":"")+'" data-act="pick" data-pid="'+p.id+'"><span><b>'+esc(p.short)+'</b><span class="s num">HI '+esc(p.hcp==null?"–":p.hcp)+' · '+esc(note)+'</span></span><span class="pill '+(g[0]==="none"?"":g[0])+'">'+(g[0]==="yes"?"✓ ":g[0]==="no"?"✕ ":g[0]==="maybe"?"? ":"")+g[1]+'</span></button>';
      });
      h+='</div>';
    });
    if(cur)h+='<button class="btn danger block" data-act="clearslot">Clear this slot</button>';
  }else if(s.type==="text"){
    h+='<div class="card-hd"><h2>'+esc(s.title)+'</h2><button class="btn" data-act="closesheet">Close</button></div><div class="small muted">Press and hold the text, choose Copy, then paste it into WhatsApp.</div><textarea id="copyBox" readonly style="min-height:200px">'+esc(s.text)+'</textarea>';
  }else if(s.type==="player"){
    var p=s.pid?pl(s.pid):null;
    h+='<div class="card-hd"><h2>'+(p?"Edit player":"Add player")+'</h2><button class="btn" data-act="closesheet">Close</button></div>'
      +'<div class="field"><label for="pShort">Name in the app</label><input id="pShort" type="text" value="'+esc(p?p.short:"")+'"></div>'
      +'<div class="field"><label for="pName">Full name</label><input id="pName" type="text" value="'+esc(p?p.name:"")+'"></div>'
      +'<div class="field"><label for="pHcp">Handicap index</label><input id="pHcp" type="number" inputmode="decimal" step="0.1" value="'+(p&&p.hcp!=null?p.hcp:"")+'"></div>'
      +'<label style="display:flex;gap:10px;align-items:center;min-height:44px"><input id="pCap" type="checkbox" style="width:22px;height:22px"'+(p&&p.cap?" checked":"")+'> Team captain</label>'
      +'<button class="btn primary block" data-act="saveplayer">Save</button>'
      +(p?'<button class="btn danger block'+(ui.confirm==="delplayer"?" on":"")+'" data-act="delplayer">'+(ui.confirm==="delplayer"?"Tap again to remove player":"Remove player")+'</button>':'');
  }
  return h+'</div>';
}

// ---- Render ----
function render(){
  var f=ui.fid?fx(ui.fid):null; if(ui.fid&&!f)ui.fid=null;
  document.getElementById("app").innerHTML=f?detailView(f):ui.tab==="players"?playersView():ui.tab==="more"?moreView():matchesView();
  document.getElementById("nav").innerHTML=navView();
  document.getElementById("sheetHost").innerHTML=sheetView();
  if(!storageOK&&ui.tab!=="more"&&!ui.warned){ui.warned=true;toast("This browser is not saving changes")}
}
function top(){window.scrollTo(0,0)}

// ---- Actions ----
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]"); if(!t)return;
  var a=t.getAttribute("data-act"), D=t.dataset, f=ui.fid?fx(ui.fid):null;
  if(ui.confirm&&ui.confirm!==a){ui.confirm=null}
  switch(a){
    case "tab": ui.tab=D.tab; ui.fid=null; ui.sheet=null; ui.confirm=null; render(); top(); break;
    case "open": ui.fid=D.fid; ui.tab="matches"; render(); top(); break;
    case "back": ui.fid=null; ui.confirm=null; render(); top(); break;
    case "av": var cur=f.av[D.pid]; if(cur===D.v)delete f.av[D.pid]; else f.av[D.pid]=D.v; save(); render(); break;
    case "slot": ui.sheet={type:"pick",idx:+D.idx}; render(); break;
    case "pick": var k=f.team.indexOf(D.pid); if(k>-1)f.team[k]=null; f.team[ui.sheet.idx]=D.pid; ui.sheet=null; save(); render(); break;
    case "clearslot": f.team[ui.sheet.idx]=null; ui.sheet=null; save(); render(); break;
    case "closesheet": ui.sheet=null; ui.confirm=null; render(); break;
    case "copyteam": copyText(teamText(f),"Team copied. Paste it into WhatsApp"); break;
    case "clearresult": f.us=null;f.them=null; save(); render(); break;
    case "addround":
      var n=S.fixtures.reduce(function(m,x){return Math.max(m,x.round)},0)+1;
      S.fixtures.push({id:"f"+Date.now(),round:n,date:"",venue:"",opp:"",notes:"",us:null,them:null,av:{},team:[null,null,null,null,null,null]});
      save(); ui.fid=S.fixtures[S.fixtures.length-1].id; render(); top(); break;
    case "delround":
      if(ui.confirm==="delround"){S.fixtures=S.fixtures.filter(function(x){return x.id!==f.id});ui.fid=null;ui.confirm=null;save();render();top();toast("Round deleted")}
      else{ui.confirm="delround";render()} break;
    case "newplayer": ui.sheet={type:"player",pid:null}; render(); break;
    case "editplayer": ui.sheet={type:"player",pid:D.pid}; render(); break;
    case "saveplayer":
      var short=document.getElementById("pShort").value.trim(), full=document.getElementById("pName").value.trim()||short;
      if(!short){toast("Enter a name first");break}
      var hv=document.getElementById("pHcp").value, hcp=hv===""?null:parseFloat(hv), cap=document.getElementById("pCap").checked;
      if(cap)S.players.forEach(function(p){p.cap=false});
      if(ui.sheet.pid){var p=pl(ui.sheet.pid);p.short=short;p.name=full;p.hcp=hcp;p.cap=cap}
      else S.players.push({id:"p"+Date.now(),short:short,name:full,hcp:hcp,cap:cap});
      ui.sheet=null; save(); render(); toast("Saved"); break;
    case "delplayer":
      if(ui.confirm==="delplayer"){var id=ui.sheet.pid;S.players=S.players.filter(function(p){return p.id!==id});
        S.fixtures.forEach(function(x){delete x.av[id];x.team=x.team.map(function(v){return v===id?null:v})});
        ui.sheet=null;ui.confirm=null;save();render();toast("Player removed")}
      else{ui.confirm="delplayer";render()} break;
    case "copybackup": copyText(JSON.stringify(S),"Backup copied"); break;
    case "restore":
      if(ui.confirm!=="restore"){
        var v0=document.getElementById("restoreBox").value.trim();
        if(!v0){toast("Paste your backup text first");break}
        ui.confirm="restore"; ui.pending=v0; render(); document.getElementById("restoreBox").value=v0; break;
      }
      try{var d=JSON.parse(ui.pending); if(!d||!Array.isArray(d.players)||!Array.isArray(d.fixtures))throw 0;
        d.fixtures.forEach(function(x){x.av=x.av||{};x.team=(x.team||[]).concat([null,null,null,null,null,null]).slice(0,6)});
        S=d; ui.confirm=null; save(); render(); toast("Backup restored")}
      catch(err){ui.confirm=null;render();toast("That text is not a valid backup")} break;
    case "reset":
      if(ui.confirm==="reset"){S=seed();ui.confirm=null;ui.fid=null;save();render();top();toast("Reset to the Excel data")}
      else{ui.confirm="reset";render()} break;
  }
});
document.addEventListener("change",function(e){
  var el=e.target; var key=el.getAttribute&&el.getAttribute("data-fx"); if(!key||!ui.fid)return;
  var f=fx(ui.fid); if(!f)return;
  if(key==="us"||key==="them"){f[key]=el.value===""?null:parseFloat(el.value); var b=document.getElementById("resBadge"); if(b)b.innerHTML=resBadge(f)}
  else f[key]=el.value;
  save();
  var set=function(id,txt){var n=document.getElementById(id);if(n)n.textContent=txt};
  set("hdrEye","Round "+f.round+" · "+fmt(f.date,true)); set("hdrTitle","v "+(f.opp||"Opponent TBC")); set("hdrSub",(f.venue||"Venue TBC")+" · "+(isHome(f)?"Home":"Away"));
});

render();
})();
</script>

</body></html>
